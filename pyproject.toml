[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brmangue-python-lua-parity"
version = "1.0.0"
description = "BR-MANGUE Studio: a reproducible Python desktop application for coastal mangrove cellular modelling"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dissmodel = ["dissmodel>=0.3.0"]

[project.scripts]
brmangue-lua-parity = "brmangue_lua.cli:main"
brmangue-studio = "brmangue_studio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brmangue_studio = ["assets/*.png", "assets/*.ico"]
