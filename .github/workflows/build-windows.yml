name: Build Windows desktop executable

on:
  push:
    branches: ["main", "fix-*"]
    paths:
      - ".github/workflows/build-windows.yml"
      - "packaging/BRMANGUE_Studio.spec"
      - "src/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/build-windows.yml"
      - "packaging/BRMANGUE_Studio.spec"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Build standalone executable
        run: python -m PyInstaller packaging/BRMANGUE_Studio.spec --clean
      - name: Prepare versioned executable and checksum
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $name = "BR-MANGUE_Studio-$version-Windows-x64.exe"
          Copy-Item "dist/BRMANGUE_Studio.exe" "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "dist/$name.sha256" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: BRMANGUE_Studio-Windows-x64
          path: |
            dist/BR-MANGUE_Studio-*-Windows-x64.exe
            dist/BR-MANGUE_Studio-*-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30
