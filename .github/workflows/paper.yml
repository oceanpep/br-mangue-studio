name: Build JOSS paper draft

on:
  push:
    paths:
      - paper.md
      - paper.bib
      - .github/workflows/paper.yml
  pull_request:
    paths:
      - paper.md
      - paper.bib
      - .github/workflows/paper.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-paper:
    name: Compile JOSS draft
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper.md
      - name: Upload draft PDF
        uses: actions/upload-artifact@v7
        with:
          name: joss-paper-draft
          path: paper.pdf
          archive: false
          if-no-files-found: error
          retention-days: 14
